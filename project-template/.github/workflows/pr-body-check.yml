name: PR body implementation check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Require bilingual implementation logic for implementation PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title || "";
            const labels = (pr.labels || []).map((label) => label.name);
            const skipLabels = new Set(["skip-pr-body-check", "docs-only", "no-pr-body-check"]);

            const conventionalTitle = /^(feat|fix|refactor|perf|docs|test|chore|style|ci|build|revert)(\(.+\))?!?:\s*\S/i.test(title);
            const githubRevertTitle = /^Revert\s+".+"$/i.test(title);
            if (!conventionalTitle && !githubRevertTitle) {
              core.setFailed(
                "PR titles must start with a conventional type, for example: feat(scope): description. " +
                "Do not prefix the title with a branch name or emoji."
              );
              return;
            }

            if (labels.some((label) => skipLabels.has(label))) {
              core.info("Skipping PR body section check because skip label is present.");
              return;
            }

            const implementationTitle = /^(feat|fix|refactor|perf)(\(.+\))?!?:/i.test(title);
            if (!implementationTitle) {
              core.info("Skipping PR body check because title is not an implementation type.");
              return;
            }

            const body = (pr.body || "").replace(/<!--[\s\S]*?-->/g, "").replace(/\r\n/g, "\n");
            const sections = [
              { name: "구현 내용 (KR)", pattern: /^##\s*구현\s*(내용|요약).*$/im },
              { name: "구현 로직 (KR)", pattern: /^##\s*구현\s*(로직|방식).*$/im },
              { name: "Implementation Summary (EN)", pattern: /^##\s*Implementation\s*Summary.*$/im },
              { name: "Implementation Logic (EN)", pattern: /^##\s*Implementation\s*(Logic|Details).*$/im },
            ];

            function sectionText(markdown, pattern) {
              const match = pattern.exec(markdown);
              if (!match) return "";
              const start = match.index + match[0].length;
              const rest = markdown.slice(start);
              const next = rest.search(/^##\s+/m);
              return (next === -1 ? rest : rest.slice(0, next)).trim();
            }

            const missing = sections
              .filter((section) => sectionText(body, section.pattern).replace(/\s+/g, " ").length < 20)
              .map((section) => section.name);

            if (missing.length > 0) {
              core.setFailed(
                [
                  "Implementation PRs must explain what changed and how it works in Korean and English.",
                  `Missing or too short sections: ${missing.join(", ")}`,
                  "Add real implementation details, not only template placeholders or file lists.",
                ].join("\n")
              );
            }
