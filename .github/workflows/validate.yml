name: validate-plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JSON 매니페스트 문법 검증 (claude CLI 미설치 환경 대비 최소 가드)
      - name: Validate JSON manifests (Claude + Codex)
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json \
                   .agents/plugins/marketplace.json plugins/codex/.codex-plugin/plugin.json; do
            echo "checking $f"; python3 -m json.tool "$f" > /dev/null
          done
          # 필수 필드 최소 가드 (Codex validator 미설치 CI 대비)
          python3 - <<'PY'
          import json,sys
          m=json.load(open('.agents/plugins/marketplace.json'))
          assert isinstance(m.get('name'),str) and m['name'], "Codex marketplace: top-level 'name' 필요"
          p=json.load(open('plugins/codex/.codex-plugin/plugin.json')); i=p.get('interface',{})
          assert i.get('longDescription'), "Codex plugin: interface.longDescription 필요"
          assert i.get('defaultPrompt'), "Codex plugin: interface.defaultPrompt 필요"
          print("Codex manifest 필수 필드 OK")
          PY

      # core 스크립트·훅 문법
      - name: py_compile core scripts+hooks
        run: python3 -m py_compile core/scripts/*.py core/hooks/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      # 정본(core)과 생성물(plugins/harness) 동기화 확인 — build.sh 안 돌린 채 커밋 방지
      - name: core↔adapter in sync (build.sh drift check)
        run: |
          ./build.sh
          if ! git diff --quiet; then
            echo "::error::plugins/harness 가 core 와 어긋남 — ./build.sh 후 커밋하세요"; git --no-pager diff --stat; exit 1
          fi

      # claude CLI 있으면 공식 검증도 (없으면 skip)
      - name: claude plugin validate (if available)
        run: |
          if command -v claude >/dev/null 2>&1; then claude plugin validate .; else echo "claude CLI 없음 — skip"; fi
