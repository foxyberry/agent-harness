name: validate-plugins

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JSON manifest syntax check (minimal guard for environments without the claude CLI)
      - name: Validate JSON manifests (Claude + Codex)
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json \
                   .agents/plugins/marketplace.json plugins/codex/.codex-plugin/plugin.json; do
            echo "checking $f"; python3 -m json.tool "$f" > /dev/null
          done
          # Minimal required-field guard (for CI without the Codex validator installed)
          python3 - <<'PY'
          import json,sys
          m=json.load(open('.agents/plugins/marketplace.json'))
          assert isinstance(m.get('name'),str) and m['name'], "Codex marketplace: top-level 'name' is required"
          p=json.load(open('plugins/codex/.codex-plugin/plugin.json')); i=p.get('interface',{})
          h=json.load(open('plugins/harness/.claude-plugin/plugin.json'))
          assert i.get('longDescription'), "Codex plugin: interface.longDescription is required"
          assert i.get('defaultPrompt'), "Codex plugin: interface.defaultPrompt is required"
          assert p.get('version') == h.get('version'), (
              f"Claude/Codex plugin version mismatch: {h.get('version')} != {p.get('version')}"
          )
          print("Codex manifest required fields OK")
          PY

      # Syntax of the core scripts and hooks
      - name: py_compile core scripts+hooks
        run: python3 -m py_compile core/scripts/*.py core/hooks/*.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      # Check the canonical source (core) against both generated adapters (plugins/harness and plugins/codex) — stops commits made without running build.sh
      - name: core↔adapter in sync (build.sh drift check)
        run: |
          ./build.sh
          if ! git diff --quiet; then
            echo "::error::plugins/harness or plugins/codex is out of sync with core - run ./build.sh before committing"; git --no-pager diff --stat; exit 1
          fi

      # Run the official validation too when the claude CLI is present (skip otherwise)
      - name: claude plugin validate (if available)
        run: |
          if command -v claude >/dev/null 2>&1; then claude plugin validate .; else echo "claude CLI not found - skip"; fi
